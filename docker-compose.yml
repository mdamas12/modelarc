services:
  mysql:
    image: mysql:8.4
    container_name: modelarc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bd_modelarc}
      MYSQL_USER: ${MYSQL_USER:-modelarc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modelarc}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: modelarc-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # En droplet, la API puede apuntar a DB_HOST=mysql (nombre del servicio).
  # En Windows local se recomienda XAMPP/MySQL nativo en 127.0.0.1:3306
  # y no levantar este contenedor si el puerto 3306 ya está ocupado.
